<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game</title>
        <style>
            body{
                text-align: center;
                font-size: 1.75em;
                color: white;
                background-color: rgb(81, 81, 81);
                width: 90%;
            }
    
            .green{background-color: rgb(0, 81, 0);}
            .red{background-color: rgb(81, 0, 0);}
    
            .buttons-display{
                display: none;
            }
    
        </style>
    </head>
    <body id="body">
        <div class="header">
            <h4 style="text-align: right;" id="score">Score: </h4>
            <h2>Quiz Game</h2>
        </div>
    
        <div class="start-buttons" id="startButtons">
            <select id = "quizSelection">
                
            </select>
            <br/>
            <br/>
            <button onclick="start()"style="width:80%; height:30%; text-align:center;">Start</button>
        </div>
    
        <div class="questions-20Item buttons-display" id="twentyItemQuiz">
            <h3 id="twentyQuestion">Question</h3>
            <input type="text" id="twentyItemInput" style="width:80%; height:30%; font-size: 2em;">
            <input type="button" id="twentyItemBtn" value="Send Answer" onclick="checkAnswer()" style="width:15%; height:30%;">
            <p id="twentyItemAnswer"></p>
        </div>
    
        <div class="answers-20Item buttons-display" id="answer">
            <h2 id="rightOrWrong"></h2>
            <h3 id="twentyCorrectAnswer"></h3>
            <input type="button" id="twentyNext" value="Next Question" onclick="questionGenerator()" style="width:80%; height:30%; text-align:center;"  >
        </div>
    
    </body>
    
    <script>
    // Game Variables //
    var totalScore = 0
    var score = 0
    var randomItemAnswer = 0
    var body = document.getElementById("body")
    var questions = []
    var answers = []
    
    // Quiz Type //
    var quizChoices = document.getElementById("quizSelection")
    
    // Input Variables //
    var twentyQuestion = document.getElementById("twentyQuestion")
    var twentyInput = document.getElementById("twentyItemInput")
    var scoreDisplay = document.getElementById("score")
    var playerAnswer = ""
    
    // Items //
    var quizes = [
        ["CCE", {
            "What article contains the rules on Filipino Citizenship?":"IV",
            "What term refers to the right to vote?":"Suffrage",
            "What article and section define suffrage?":"Article V Section 1",
            "Which section guarantees due process of law and equal protection of the laws?": "1", 
            "Which section protects against unreasonable searches and seizures and outlines search warrant requirements?": "2", 
            "Which section guarantees the privacy of communication and correspondence?": "3", 
            "Which section protects the freedom of speech, expression, the press, and the right to peaceably assemble?": "4", 
            "Which section guarantees the free exercise and enjoyment of religious profession and worship?": "5", 
            "Which section secures the liberty of abode and the right to travel?": "6", 
            "Which section guarantees the right of the people to information on matters of public concern?": "7", 
            "Which section protects the right to form unions, associations, or societies?": "8", 
            "Which section states that private property shall not be taken for public use without just compensation?": "9", 
            "Which section guarantees that no law impairing the obligation of contracts shall be passed?": "10", 
            "Which section ensures free access to courts and quasi-judicial bodies and adequate legal assistance?": "11", 
            "Which section guarantees rights under custodial investigation, including the right to remain silent and to counsel?": "12", 
            "Which section provides the right to bail and protects against excessive bail?": "13", 
            "Which section details the constitutional rights of the accused in criminal prosecutions, including the presumption of innocence?": "14", 
            "Which section provides for the privilege of the writ of habeas corpus?": "15", 
            "Which section guarantees the right to a speedy disposition of cases before all judicial, quasi-judicial, or administrative bodies?": "16", 
            "Which section protects against self-incrimination (compulsory testimony against oneself)?": "17", 
            "Which section prohibits detention solely by reason of political beliefs and involuntary servitude?": "18", 
            "Which section prohibits excessive fines, as well as cruel, degrading, or inhuman punishment?": "19", 
            "Which section states that no person shall be imprisoned for debt or non-payment of a poll tax?": "20", 
            "Which section protects against double jeopardy?": "21", "Which section prohibits ex post facto laws and bills of attainder?": "22"
            }],
        
    ]

    // Quiz Options
    var quizOptions = document.getElementById('quizSelection')

    // Load Options //
    for (let i = 0; i < quizes.length; i++) {
        quizOptions.innerHTML += `<option style="text-align: center;">${quizes[i][0]}</option>`
    } 

    // start game //
    function start() {
        document.getElementById("startButtons").classList.toggle("buttons-display")
        document.getElementById("twentyItemQuiz").classList.toggle("buttons-display")

        var quizType = quizChoices.selectedIndex
        questions = Object.keys(quizes[quizType][1])
        answers = Object.values(quizes[quizType][1])
        console.log(questions)
        questionGenerator()
    }
    
    // Random Number Generator //
    function randomInt(min, max) { // min and max included
      return Math.floor(Math.random() * (max - min + 1) + min)
    }
    
    // Question Generator //
    function questionGenerator() {
        //hide items
        body.classList.remove("red")
        body.classList.remove("green")
        document.getElementById("answer").classList.add("buttons-display")
        document.getElementById("twentyItemQuiz").classList.remove("buttons-display")
        document.getElementById('twentyItemInput').value = ""
        
        randomItemAnswer = randomInt(0, (answers.length) - 1)
    
        // Question Generate
        twentyQuestion.innerHTML = (questions[randomItemAnswer])
    }
    
    // Check Answers //
    function checkAnswer() {
        // Hide question and Input //
        document.getElementById("twentyItemQuiz").classList.toggle("buttons-display")
    
        // Get Input //
        var playerAnswer = twentyInput.value;
        toString(playerAnswer)
    
        document.getElementById("rightOrWrong").innerHTML = "INCORRECT!"
        body.classList.add("red")
    
        document.getElementById("twentyCorrectAnswer").innerHTML = `The answer is "${answers[randomItemAnswer]}"`
        if (playerAnswer.toUpperCase() == answers[randomItemAnswer].toUpperCase()){
            document.getElementById("rightOrWrong").innerHTML = "CORRECT!"
            body.classList.remove("red")
            body.classList.add("green")
            score += 1
        }
        
        totalScore += 1
        scoreDisplay.innerHTML = `Score: ${score}/${totalScore}`
        document.getElementById("answer").classList.remove("buttons-display")
    }
    </script>
    </html>
